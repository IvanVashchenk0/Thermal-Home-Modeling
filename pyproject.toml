[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-home-modeling"
version = "0.1.0"
description = "Reliable EnergyPlus experiments for residential efficiency research"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "pyarrow>=16,<24", "python-dotenv>=1,<2", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
ui = ["streamlit>=1.46,<2"]
dev = ["pytest>=8,<10", "streamlit>=1.46,<2"]

[project.scripts]
thermal-home = "thermal_home_modeling.cli:main"

[tool.setuptools.packages.find]
include = ["thermal_home_modeling*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires an installed EnergyPlus and real input assets"]
